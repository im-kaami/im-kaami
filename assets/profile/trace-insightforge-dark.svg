<svg xmlns="http://www.w3.org/2000/svg" width="860" height="130" viewBox="0 0 860 130" role="img" aria-labelledby="title desc">
  <title id="title">InsightForge AI System Trace</title>
  <desc id="desc">Input natural language question, process via DuckDB SQL and statistical engine, audit through numeric reconciliation checks, and output verified charts and summaries.</desc>
  <style>
    .bg { fill: #12161f; }
    .frame { fill: none; stroke: #263043; stroke-width: 1; }
    .stage { fill: #1a2233; stroke: #334155; stroke-width: 1; }
    .stage-check { fill: rgba(16, 185, 129, 0.08); stroke: #10b981; stroke-width: 1.2; }
    .mono { font-family: "IBM Plex Mono", ui-monospace, SFMono-Regular, "Cascadia Mono", Consolas, Menlo, monospace; }
    .sans { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif; }
    .hdr { fill: #64748b; font-size: 9.5px; letter-spacing: 1.2px; font-weight: 600; }
    .title { fill: #f3f4f6; font-size: 12px; font-weight: 600; }
    .body { fill: #94a3b8; font-size: 11px; }
    .accent { fill: #10b981; font-weight: 600; font-size: 11px; }
    .arrow { stroke: #10b981; stroke-width: 1.4; fill: none; }
    .arrow-h { fill: #10b981; }
    .caption { fill: #64748b; font-size: 10.5px; }
  </style>

  <rect width="860" height="130" rx="6" class="bg"/>
  <rect x="0.5" y="0.5" width="859" height="129" rx="5.5" class="frame"/>

  <!-- Trace 1: Input -->
  <g transform="translate(18 16)">
    <rect width="180" height="76" rx="4" class="stage"/>
    <text x="12" y="18" class="mono hdr">01 · INPUT</text>
    <text x="12" y="38" class="sans title">Analytical Query</text>
    <text x="12" y="56" class="mono body">"Calculate retention delta"</text>
  </g>

  <line x1="202" y1="54" x2="224" y2="54" class="arrow"/>
  <polygon points="224,51 229,54 224,57" class="arrow-h"/>

  <!-- Trace 2: Compute -->
  <g transform="translate(232 16)">
    <rect width="190" height="76" rx="4" class="stage"/>
    <text x="12" y="18" class="mono hdr">02 · PROCESS</text>
    <text x="12" y="38" class="sans title">Deterministic Math</text>
    <text x="12" y="56" class="mono body">DuckDB SQL + scipy engine</text>
  </g>

  <line x1="426" y1="54" x2="448" y2="54" class="arrow"/>
  <polygon points="448,51 453,54 448,57" class="arrow-h"/>

  <!-- Trace 3: Check -->
  <g transform="translate(456 16)">
    <rect width="180" height="76" rx="4" class="stage-check"/>
    <text x="12" y="18" class="mono hdr" fill="#10b981">03 · CHECK</text>
    <text x="12" y="38" class="sans title">Numeric Diff Audit</text>
    <text x="12" y="56" class="mono accent">Text numbers == table cells</text>
  </g>

  <line x1="640" y1="54" x2="662" y2="54" class="arrow"/>
  <polygon points="662,51 667,54 662,57" class="arrow-h"/>

  <!-- Trace 4: Output -->
  <g transform="translate(670 16)">
    <rect width="172" height="76" rx="4" class="stage"/>
    <text x="12" y="18" class="mono hdr">04 · OUTPUT</text>
    <text x="12" y="38" class="sans title">Verified Report</text>
    <text x="12" y="56" class="mono body">Inspectable SQL + visual</text>
  </g>

  <text x="24" y="114" class="mono caption">Trace: input question → local SQL execution → numeric verification check → human review</text>
</svg>
