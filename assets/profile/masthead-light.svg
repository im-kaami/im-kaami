<svg xmlns="http://www.w3.org/2000/svg" width="100%" height="auto" viewBox="0 0 420 115" role="img" aria-labelledby="title desc">
  <title id="title">Muhammad Ikram Hafeez — Evidence Log</title>
  <desc id="desc">Useful systems. Inspectable results. Evidence-led engineering profile across AI, data and automation.</desc>
  <style>
    .bg { fill: #fcfcfb; }
    .frame { fill: none; stroke: #d0d7de; stroke-width: 1; }
    .serif { font-family: Newsreader, "Iowan Old Style", Charter, Georgia, "Times New Roman", serif; }
    .mono { font-family: "IBM Plex Mono", ui-monospace, SFMono-Regular, "Cascadia Mono", Consolas, Menlo, monospace; }
    .sans { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif; }
    .tag { fill: #0969da; font-size: 16px; letter-spacing: 1.2px; font-weight: 600; }
    .title { fill: #1f2328; font-size: 22px; font-weight: 500; letter-spacing: -0.3px; }
    .title-em { fill: #0969da; font-style: italic; }
    .status-dot { fill: #1a7f37; }
    .status-txt { fill: #1a7f37; font-size: 16px; font-weight: 600; }
  </style>

  <rect width="420" height="115" rx="8" class="bg"/>
  <rect x="0.5" y="0.5" width="419" height="114" rx="7.5" class="frame"/>
  <rect x="0" y="20" width="4" height="75" rx="2" fill="#0969da"/>

  <g transform="translate(20 18)">
    <text x="0" y="15" class="mono tag">EVIDENCE LOG · 2026</text>
    <text x="0" y="46" class="serif title">Useful systems. <tspan class="title-em">Inspectable results.</tspan></text>
    <circle cx="5" cy="74" r="5" class="status-dot"/>
    <text x="18" y="79" class="sans status-txt">Open to internships &amp; part-time roles</text>
  </g>
</svg>
