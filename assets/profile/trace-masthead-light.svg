<svg xmlns="http://www.w3.org/2000/svg" width="920" height="120" viewBox="0 0 920 120" role="img" aria-labelledby="title desc">
  <title id="title">Muhammad Ikram Hafeez — System Trace</title>
  <desc id="desc">Input, process, and verified output traces across AI, data and automation engineering.</desc>
  <style>
    .bg { fill: #f8fafc; }
    .frame { fill: none; stroke: #cbd5e1; stroke-width: 1; }
    .mono { font-family: "IBM Plex Mono", ui-monospace, SFMono-Regular, "Cascadia Mono", Consolas, Menlo, monospace; }
    .sans { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif; }
    .tag { fill: #059669; font-size: 11px; letter-spacing: 2px; font-weight: 600; }
    .title { fill: #0f172a; font-size: 24px; font-weight: 600; letter-spacing: -0.4px; }
    .title-accent { fill: #059669; }
    .sub { fill: #64748b; font-size: 13px; }
    .status-dot { fill: #059669; }
    .status-txt { fill: #059669; font-size: 11.5px; font-weight: 600; }
    .pill { fill: rgba(5, 150, 105, 0.08); stroke: rgba(5, 150, 105, 0.3); }
    .rule { stroke: #cbd5e1; }
  </style>

  <rect width="920" height="120" rx="8" class="bg"/>
  <rect x="0.5" y="0.5" width="919" height="119" rx="7.5" class="frame"/>

  <rect x="0" y="24" width="4" height="72" rx="2" fill="#059669"/>

  <g transform="translate(32 26)">
    <text x="0" y="14" class="mono tag">SYSTEM TRACE · ENGINEERING PROFILE</text>
    <text x="0" y="46" class="sans title">Useful systems. <tspan class="title-accent">Inspectable results.</tspan></text>
    <text x="0" y="70" class="mono sub">Input → Process → Check → Output across AI, data &amp; automation</text>
  </g>

  <line x1="640" x2="640" y1="20" y2="100" class="rule"/>

  <g transform="translate(670 34)">
    <circle cx="6" cy="12" r="4" class="status-dot"/>
    <text x="18" y="16" class="sans status-txt">Open to internships &amp; part-time</text>
    <rect x="0" y="32" width="220" height="24" rx="4" class="pill"/>
    <text x="110" y="48" text-anchor="middle" class="mono" font-size="11" fill="#059669">CSE @ Óbuda · Xerox Delivery</text>
  </g>
</svg>
