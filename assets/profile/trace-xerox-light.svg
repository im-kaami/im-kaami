<svg xmlns="http://www.w3.org/2000/svg" width="860" height="130" viewBox="0 0 860 130" role="img" aria-labelledby="title desc">
  <title id="title">Xerox Automation System Trace</title>
  <desc id="desc">Input multi-account payload, process via Power Automate and Excel VBA, audit operational flags, and output weekly reports in one minute per account.</desc>
  <style>
    .bg { fill: #f8fafc; }
    .frame { fill: none; stroke: #cbd5e1; stroke-width: 1; }
    .stage { fill: #ffffff; stroke: #cbd5e1; stroke-width: 1; }
    .stage-check { fill: rgba(5, 150, 105, 0.05); stroke: #059669; stroke-width: 1.2; }
    .mono { font-family: "IBM Plex Mono", ui-monospace, SFMono-Regular, "Cascadia Mono", Consolas, Menlo, monospace; }
    .sans { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif; }
    .hdr { fill: #64748b; font-size: 9.5px; letter-spacing: 1.2px; font-weight: 600; }
    .title { fill: #0f172a; font-size: 12px; font-weight: 600; }
    .body { fill: #475569; font-size: 11px; }
    .accent { fill: #059669; font-weight: 600; font-size: 11px; }
    .arrow { stroke: #059669; stroke-width: 1.4; fill: none; }
    .arrow-h { fill: #059669; }
    .caption { fill: #64748b; font-size: 10.5px; }
  </style>

  <rect width="860" height="130" rx="6" class="bg"/>
  <rect x="0.5" y="0.5" width="859" height="129" rx="5.5" class="frame"/>

  <!-- Trace 1: Input -->
  <g transform="translate(18 16)">
    <rect width="180" height="76" rx="4" class="stage"/>
    <text x="12" y="18" class="mono hdr">01 · INGESTION</text>
    <text x="12" y="38" class="sans title">100+ Account Payloads</text>
    <text x="12" y="56" class="mono body">Outlook attachments + Forms</text>
  </g>

  <line x1="202" y1="54" x2="224" y2="54" class="arrow"/>
  <polygon points="224,51 229,54 224,57" class="arrow-h"/>

  <!-- Trace 2: Pipeline -->
  <g transform="translate(232 16)">
    <rect width="190" height="76" rx="4" class="stage"/>
    <text x="12" y="18" class="mono hdr">02 · AUTOMATION</text>
    <text x="12" y="38" class="sans title">Pipeline Processing</text>
    <text x="12" y="56" class="mono body">Power Automate + Excel VBA</text>
  </g>

  <line x1="426" y1="54" x2="448" y2="54" class="arrow"/>
  <polygon points="448,51 453,54 448,57" class="arrow-h"/>

  <!-- Trace 3: Audit -->
  <g transform="translate(456 16)">
    <rect width="180" height="76" rx="4" class="stage-check"/>
    <text x="12" y="18" class="mono hdr" fill="#059669">03 · AUDIT</text>
    <text x="12" y="38" class="sans title">Phase &amp; Field Check</text>
    <text x="12" y="56" class="mono accent">40+ day stall flags</text>
  </g>

  <line x1="640" y1="54" x2="662" y2="54" class="arrow"/>
  <polygon points="662,51 667,54 662,57" class="arrow-h"/>

  <!-- Trace 4: Output -->
  <g transform="translate(670 16)">
    <rect width="172" height="76" rx="4" class="stage"/>
    <text x="12" y="18" class="mono hdr">04 · OUTCOME</text>
    <text x="12" y="38" class="sans title">~1 Min / Account</text>
    <text x="12" y="56" class="mono body">~25% backlog reduction</text>
  </g>

  <text x="24" y="114" class="mono caption">Trace: manual 30 min preparation automated to ~1 min per account · backlog reduced ~25%</text>
</svg>
